name: APK
on: {push: {branches: [main]}, workflow_dispatch: {}}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q cirilo.zip
          git clone --depth 1 https://github.com/mgba-emu/mgba cirilo/mgba
          sed -i 's/PROPERTIES PREFIX "" COMPILE_DEFINITIONS/PROPERTIES COMPILE_DEFINITIONS/' cirilo/mgba/CMakeLists.txt
          ! grep -q 'PROPERTIES PREFIX "" COMPILE_DEFINITIONS' cirilo/mgba/CMakeLists.txt
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.7"}
      - name: Clave de firma
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Falta el secreto KEYSTORE_B64"; exit 1; fi
          echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/cirilo.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/cirilo.jks" >> "$GITHUB_ENV"
          echo "SHA-1 de la clave de firma:"
          keytool -list -v -keystore "$RUNNER_TEMP/cirilo.jks" -alias "$KA" -storepass "$KP" | grep "SHA1"
      - run: gradle assembleDebug --no-daemon
        working-directory: cirilo
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - run: unzip -l app/build/outputs/apk/debug/*.apk | grep "\.so"
        working-directory: cirilo
      - uses: actions/upload-artifact@v4
        with: {name: cirilo-debug, path: cirilo/app/build/outputs/apk/debug/*.apk}
