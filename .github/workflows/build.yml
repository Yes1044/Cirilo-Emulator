name: APK
on: {push: {branches: [main]}, workflow_dispatch: {}}
jobs:
  # Automatiza el punto 5 de tools/test/LEEME.txt (hasta ahora, a mano): compila mGBA sin tocar y con el camino rápido de memoria
  # (host Linux, nada de Android) y falla el build si el estado serializado difiere en algún fotograma, o si la prueba diferencial
  # (GBALoadN/StoreN vs cirilo_ldN/stN) encuentra alguna discrepancia. No usa ROMs comerciales (Doom, Pokémon...): nada de eso
  # se mete en el repo ni en CI por derechos de autor; la ROM de estrés es generada y no tiene ese problema. Si alguna vez querés
  # una pasada adicional contra tus propias ROMs legítimas, seguí el punto 5 de LEEME.txt en tu máquina (./fast_run núcleo.so tu.gba N).
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias para la ROM de estrés
        run: sudo apt-get update -y && sudo apt-get install -y clang lld llvm
      - name: Descomprimir y bajar mGBA (dos copias: orig y fast)
        run: |
          unzip -q cirilo.zip
          for d in orig fast; do
            git init "cirilo/$d"
            git -C "cirilo/$d" fetch --depth 1 https://github.com/mgba-emu/mgba a67176cd3e6bf60a5016d7adc94357142dd12617
            git -C "cirilo/$d" checkout FETCH_HEAD
          done
      - name: Parchear «fast» con el camino rápido de memoria
        run: cd cirilo && python3 tools/cirilo_fast_patch.py fast cortex-a76
      - name: Compilar orig y fast (núcleo libretro, host Linux)
        run: |
          cd cirilo
          for d in orig fast; do
            cmake -S "$d" -B "$d/b" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -fwrapv" \
              -DBUILD_LIBRETRO=ON -DSKIP_LIBRARY=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF -DDISABLE_DEPS=ON -DUSE_EPOXY=OFF \
              -DBUILD_GL=OFF -DBUILD_GLES2=OFF -DBUILD_GLES3=OFF -DENABLE_SCRIPTING=OFF -DUSE_LUA=OFF -DUSE_FREETYPE=OFF \
              -DUSE_JSON_C=OFF -DUSE_LZMA=OFF -DUSE_ELF=OFF -DUSE_DISCORD_RPC=OFF
            cmake --build "$d/b" -j"$(nproc)" --target mgba_libretro
          done
      - name: ROM de estrés (generada, sin derechos de terceros)
        run: sh cirilo/tools/test/fast_stress.sh cirilo/salida
      - name: Comparar estado serializado 4000 fotogramas (orig vs fast)
        run: |
          cd cirilo
          gcc -O1 -o fast_run tools/test/fast_run.c -ldl
          ./fast_run orig/b/mgba_libretro.so salida/fast_stress.gba 4000 > o.txt
          ./fast_run fast/b/mgba_libretro.so  salida/fast_stress.gba 4000 > f.txt
          diff -u o.txt f.txt && echo "ok: orig y fast dan exactamente el mismo estado en 4000 fotogramas"
      - name: Prueba diferencial (10M comparaciones contra GBALoadN/StoreN)
        run: |
          cd cirilo
          cp -r fast fastT
          cat tools/test/fast_diff_hook.c >> fastT/src/platform/libretro/libretro.c
          cmake --build fastT/b -j"$(nproc)" --target mgba_libretro
          ./fast_run fastT/b/mgba_libretro.so salida/fast_stress.gba 100 d
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir y bajar mGBA
        run: |
          unzip -q cirilo.zip
          git init cirilo/mgba && git -C cirilo/mgba fetch --depth 1 https://github.com/mgba-emu/mgba a67176cd3e6bf60a5016d7adc94357142dd12617 && git -C cirilo/mgba checkout FETCH_HEAD
      - name: Cable de Link local (GBA) en el núcleo
        run: |
          # Compila el lockstep de mGBA dentro del núcleo libretro, le pone mutex reales (un hilo por consola) y hace que retro_run llame a cirilo_runframe en vez de core->runFrame.
          # Solo si este mGBA trae la API que usa tools/cirilo_link.c; si no, se sigue sin cable (la app lo avisa).
          cd cirilo
          L=mgba/include/mgba/internal/gba/sio/lockstep.h
          if [ -f tools/cirilo_link.c ] && grep -q GBASIOLockstepCoordinatorAttach $L && grep -q 'struct mLockstepUser' mgba/include/mgba/core/lockstep.h && grep -q 'add_library(${BINARY_NAME}_libretro SHARED ${CORE_SRC} ${RETRO_SRC} ${CORE_VFS_SRC})' mgba/CMakeLists.txt; then
            sed -i 's|add_library(${BINARY_NAME}_libretro SHARED ${CORE_SRC} ${RETRO_SRC} ${CORE_VFS_SRC})|add_library(${BINARY_NAME}_libretro SHARED ${CORE_SRC} ${RETRO_SRC} ${CORE_VFS_SRC} ${CMAKE_CURRENT_SOURCE_DIR}/src/gba/sio/lockstep.c)|' mgba/CMakeLists.txt
            # El mutex del coordinador de mGBA es un void* vacío con DISABLE_THREADING: con un hilo por consola hace falta uno real (cirilo_mx_* está en tools/cirilo_link.c)
            sed -i 's/\bMutexInit(/cirilo_mx_init(/g; s/\bMutexDeinit(/cirilo_mx_deinit(/g; s/\bMutexLock(/cirilo_mx_lock(/g; s/\bMutexUnlock(/cirilo_mx_unlock(/g' mgba/src/gba/sio/lockstep.c
            sed -i '0,/^#include <mgba\/internal\/gba\/sio\/lockstep.h>/s//&\nint cirilo_mx_init(Mutex*);\nint cirilo_mx_deinit(Mutex*);\nint cirilo_mx_lock(Mutex*);\nint cirilo_mx_unlock(Mutex*);/' mgba/src/gba/sio/lockstep.c
            sed -i 's/^void retro_run(void) {/void cirilo_runframe(struct mCore*);\nvoid* cirilo_vbuf(void*);\nvoid retro_run(void) {/; s/^\tcore->runFrame(core);/\tcirilo_runframe(core);/; s/videoCallback(outputBuffer, width/videoCallback(cirilo_vbuf(outputBuffer), width/' mgba/src/platform/libretro/libretro.c
            cat tools/cirilo_link.c >> mgba/src/platform/libretro/libretro.c
            if grep -q 'src/gba/sio/lockstep.c' mgba/CMakeLists.txt && grep -c 'cirilo_mx_' mgba/src/gba/sio/lockstep.c | grep -qv '^[01]$' && ! grep -q 'MutexLock(' mgba/src/gba/sio/lockstep.c && grep -q 'cirilo_runframe(core);' mgba/src/platform/libretro/libretro.c && grep -q 'cirilo_vbuf(outputBuffer)' mgba/src/platform/libretro/libretro.c && grep -q cirilo_link_attach mgba/src/platform/libretro/libretro.c; then echo "ok: cable de Link local incluido"
            else echo "::warning::No se pudo parchear mGBA para el cable de Link local: se sigue sin cable"; git -C mgba checkout -- .; fi
          else echo "::warning::Sin cable de Link local (falta tools/cirilo_link.c o este mGBA no trae el lockstep esperado)"; fi
      - name: Trucos y ajustes del núcleo
        run: |
          cat cirilo/tools/cirilo_cheats.c >> cirilo/mgba/src/platform/libretro/libretro.c
          grep -q cirilo_cheat_apply cirilo/mgba/src/platform/libretro/libretro.c
          sed -i 's/PROPERTIES PREFIX "" COMPILE_DEFINITIONS/PROPERTIES COMPILE_DEFINITIONS/' cirilo/mgba/CMakeLists.txt
          ! grep -q 'PROPERTIES PREFIX "" COMPILE_DEFINITIONS' cirilo/mgba/CMakeLists.txt
      - name: Camino rápido de memoria en el núcleo
        run: |
          cd cirilo
          # Resuelve en línea las cargas/guardados de IWRAM, EWRAM y (cargas) ROM en isa-arm.c/isa-thumb.c (tools/cirilo_fast.h), y -mtune en arm64. Todo o nada: si este mGBA no encaja, se sigue sin él.
          # Va ANTES del paso "Segundo núcleo": ese paso hace `cp -r mgba mgba2`, así que si este patch ya está aplicado aquí, mgba2 lo hereda solo (igual que cable/trucos/medidor) y no hace falta aplicarlo dos veces.
          if [ -f tools/cirilo_fast.h ] && [ -f tools/cirilo_fast_patch.py ] && python3 tools/cirilo_fast_patch.py mgba cortex-a76; then
            echo "ok: camino rápido de memoria"
          else echo "::warning::Sin camino rápido de memoria: el núcleo queda como mGBA original"; fi
      - name: Medidor de CPU (reparto del tiempo) en el núcleo
        run: |
          cd cirilo
          # Instrumenta ARMRunLoop, el dibujo de línea y el audio de mGBA y añade cirilo_prof_take (tools/cirilo_prof.c). Todo o nada: si este mGBA no encaja, se sigue sin medidor.
          if [ -f tools/cirilo_prof.c ] && [ -f tools/cirilo_prof_patch.py ] && python3 tools/cirilo_prof_patch.py mgba; then
            cat tools/cirilo_prof.c >> mgba/src/platform/libretro/libretro.c
            grep -q cirilo_prof_take mgba/src/platform/libretro/libretro.c
          else echo "::warning::Sin medidor de CPU: el panel no mostrará el reparto del tiempo"; fi
      - name: Segundo núcleo para Link local (copia de mgba con otro nombre de biblioteca)
        run: |
          cd cirilo
          # cada .so tiene sus propias variables globales: dos copias = dos consolas independientes en el mismo proceso
          rm -rf mgba2; cp -r mgba mgba2
          # renombra el objetivo libretro (mgba_libretro -> mgba2_libretro) en todos los CMakeLists, sea cual sea la versión de mGBA
          find mgba2 \( -name CMakeLists.txt -o -name '*.cmake' \) -exec sed -i 's/_libretro/2_libretro/g' {} +
          if grep -rq '}2_libretro\|mgba2_libretro' mgba2 --include=CMakeLists.txt --include='*.cmake'; then echo "ok: mgba2 -> libmgba2_libretro.so"
          else echo "::warning::No se pudo preparar el segundo núcleo: Link local no estará disponible"; rm -rf mgba2; fi
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.7"}
      - name: Clave de firma
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Falta el secreto KEYSTORE_B64"; exit 1; fi
          echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/cirilo.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/cirilo.jks" >> "$GITHUB_ENV"
          echo "SHA-1 de la clave de firma:"
          keytool -list -v -keystore "$RUNNER_TEMP/cirilo.jks" -alias "$KA" -storepass "$KP" | grep "SHA1"
      - run: gradle assembleDebug --no-daemon
        working-directory: cirilo
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Comprobar que los núcleos llevan lo esperado
        working-directory: cirilo
        run: |
          mkdir chk && unzip -q -o app/build/outputs/apk/debug/*.apk 'lib/*/*.so' -d chk
          for f in chk/lib/*/libmgba_libretro.so; do grep -q cirilo_cheat_apply "$f" && echo "ok trucos: $f" || { echo "::error::$f no exporta cirilo_cheat_apply"; exit 1; }; done
          if [ -d mgba2 ]; then for f in chk/lib/*/libmgba2_libretro.so; do [ -f "$f" ] && echo "ok segundo núcleo: $f" || { echo "::error::falta libmgba2_libretro.so en el APK"; exit 1; }; done; else echo "::warning::APK SIN segundo núcleo"; fi
          grep -q cirilo_link_attach mgba/src/platform/libretro/libretro.c && { for f in chk/lib/*/libmgba_libretro.so; do grep -q cirilo_link_attach "$f" && echo "ok cable: $f" || { echo "::error::$f no exporta cirilo_link_attach"; exit 1; }; done; } || echo "::warning::APK SIN cable de Link local"
          grep -q cirilo_prof_take mgba/src/platform/libretro/libretro.c && { for f in chk/lib/*/libmgba_libretro.so; do grep -q cirilo_prof_take "$f" && echo "ok medidor: $f" || { echo "::error::$f no exporta cirilo_prof_take"; exit 1; }; done; } || echo "::warning::APK SIN medidor de CPU"
          # cirilo_ld32/stN son `static inline`: con -O3 el compilador las integra y no queda símbolo que buscar en el .so (a diferencia de cirilo_cheat_apply/cirilo_link_attach/cirilo_prof_take, con enlace externo). Solo se puede comprobar en la fuente.
          if grep -q cirilo_ld32 mgba/include/mgba/internal/gba/cirilo_fast.h 2>/dev/null && grep -q 'cirilo_ld32(' mgba/src/arm/isa-arm.c; then echo "ok camino rápido: aplicado en la fuente (el job «regression» ya comprueba que el .so compilado se comporta igual)"
          else echo "::warning::APK SIN camino rápido de memoria"; fi
      - uses: actions/upload-artifact@v4
        with: {name: cirilo-debug, path: cirilo/app/build/outputs/apk/debug/*.apk}
