name: APK
on: {push: {branches: [main]}, workflow_dispatch: {}}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q cirilo.zip
          git init cirilo/mgba && git -C cirilo/mgba fetch --depth 1 https://github.com/mgba-emu/mgba a67176cd3e6bf60a5016d7adc94357142dd12617 && git -C cirilo/mgba checkout FETCH_HEAD
          # --- Link local: cable (solo si este mGBA trae la API; si no, se sigue sin cable) ---
          if [ -f cirilo/tools/cirilo_link.c ] && grep -q GBASIOLockstepCoordinatorAttach cirilo/mgba/include/mgba/internal/gba/sio/lockstep.h && grep -q 'add_library(${BINARY_NAME}_libretro SHARED ${CORE_SRC} ${RETRO_SRC} ${CORE_VFS_SRC})' cirilo/mgba/CMakeLists.txt; then
            sed -i 's|add_library(${BINARY_NAME}_libretro SHARED ${CORE_SRC} ${RETRO_SRC} ${CORE_VFS_SRC})|add_library(${BINARY_NAME}_libretro SHARED ${CORE_SRC} ${RETRO_SRC} ${CORE_VFS_SRC} ${CMAKE_CURRENT_SOURCE_DIR}/src/gba/sio/lockstep.c)|' cirilo/mgba/CMakeLists.txt
            sed -i 's/^void retro_run(void) {/void cirilo_runframe(struct mCore*);\nvoid* cirilo_vbuf(void*);\nvoid retro_run(void) {/; s/^\tcore->runFrame(core);/\tcirilo_runframe(core);/; s/videoCallback(outputBuffer, width/videoCallback(cirilo_vbuf(outputBuffer), width/' cirilo/mgba/src/platform/libretro/libretro.c
            cat cirilo/tools/cirilo_link.c >> cirilo/mgba/src/platform/libretro/libretro.c
            if grep -q 'src/gba/sio/lockstep.c' cirilo/mgba/CMakeLists.txt && grep -q 'cirilo_runframe(core);' cirilo/mgba/src/platform/libretro/libretro.c && grep -q 'cirilo_vbuf(outputBuffer)' cirilo/mgba/src/platform/libretro/libretro.c; then echo "ok: cable de Link local incluido"
            else echo "::warning::No se pudo parchear mGBA para el cable"; git -C cirilo/mgba checkout -- .; fi
          else echo "::warning::Sin cable de Link local"; fi
          cat cirilo/tools/cirilo_cheats.c >> cirilo/mgba/src/platform/libretro/libretro.c
          grep -q cirilo_cheat_apply cirilo/mgba/src/platform/libretro/libretro.c
          sed -i 's/PROPERTIES PREFIX "" COMPILE_DEFINITIONS/PROPERTIES COMPILE_DEFINITIONS/' cirilo/mgba/CMakeLists.txt
          ! grep -q 'PROPERTIES PREFIX "" COMPILE_DEFINITIONS' cirilo/mgba/CMakeLists.txt
          # --- Link local: segundo núcleo (copia con el objetivo renombrado) ---
          rm -rf cirilo/mgba2; cp -r cirilo/mgba cirilo/mgba2
          find cirilo/mgba2 \( -name CMakeLists.txt -o -name '*.cmake' \) -exec sed -i 's/_libretro/2_libretro/g' {} +
          grep -rq 'mgba2_libretro\|}2_libretro' cirilo/mgba2 --include=CMakeLists.txt || { echo "::warning::sin segundo núcleo"; rm -rf cirilo/mgba2; }
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.7"}
      - name: Clave de firma
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Falta el secreto KEYSTORE_B64"; exit 1; fi
          echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/cirilo.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/cirilo.jks" >> "$GITHUB_ENV"
          echo "SHA-1 de la clave de firma:"
          keytool -list -v -keystore "$RUNNER_TEMP/cirilo.jks" -alias "$KA" -storepass "$KP" | grep "SHA1"
      - run: gradle assembleDebug --no-daemon
        working-directory: cirilo
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Comprobar que el núcleo exporta la API de trucos
        working-directory: cirilo
        run: |
          mkdir chk && unzip -q -o app/build/outputs/apk/debug/*.apk 'lib/*/libmgba_libretro.so' -d chk
          for f in chk/lib/*/libmgba_libretro.so; do grep -q cirilo_cheat_apply "$f" && echo "ok: $f" || { echo "::error::$f no exporta cirilo_cheat_apply"; exit 1; }; done
      - uses: actions/upload-artifact@v4
        with: {name: cirilo-debug, path: cirilo/app/build/outputs/apk/debug/*.apk}
