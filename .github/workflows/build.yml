name: APK
on: {push: {branches: [main]}, workflow_dispatch: {inputs: {perfil: {description: "Build de PERFIL (PGO): instrumentada, más lenta, solo para sacar el perfil", type: boolean, default: false}}}}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir y bajar mGBA
        run: |
          unzip -q cirilo.zip
          git init cirilo/mgba && git -C cirilo/mgba fetch --depth 1 https://github.com/mgba-emu/mgba a67176cd3e6bf60a5016d7adc94357142dd12617 && git -C cirilo/mgba checkout FETCH_HEAD
      - name: Cable de Link local (GBA y GB/GBC) en el núcleo
        run: |
          # Compila el lockstep de mGBA dentro del núcleo libretro, le pone mutex reales (un hilo por consola) y hace que retro_run llame a cirilo_runframe en vez de core->runFrame.
          # Solo si este mGBA trae la API que usa tools/cirilo_link.c; si no, se sigue sin cable (la app lo avisa).
          cd cirilo
          L=mgba/include/mgba/internal/gba/sio/lockstep.h
          if [ -f tools/cirilo_link.c ] && grep -q GBASIOLockstepCoordinatorAttach $L && grep -q GBSIOLockstepAttachNode mgba/include/mgba/internal/gb/sio/lockstep.h && grep -q 'struct mLockstepUser' mgba/include/mgba/core/lockstep.h && grep -q 'add_library(${BINARY_NAME}_libretro SHARED ${CORE_SRC} ${RETRO_SRC} ${CORE_VFS_SRC})' mgba/CMakeLists.txt; then
            sed -i 's|add_library(${BINARY_NAME}_libretro SHARED ${CORE_SRC} ${RETRO_SRC} ${CORE_VFS_SRC})|add_library(${BINARY_NAME}_libretro SHARED ${CORE_SRC} ${RETRO_SRC} ${CORE_VFS_SRC} ${CMAKE_CURRENT_SOURCE_DIR}/src/gba/sio/lockstep.c ${CMAKE_CURRENT_SOURCE_DIR}/src/gb/sio/lockstep.c)|' mgba/CMakeLists.txt
            # Cargar un estado con cable en GBA: la lista de eventos libres que reconstruye LoadState no acaba en NULL y acababa corrompiéndose (segfault ocasional al seguir jugando)
            sed -i 's|^\tplayer->queue = NULL;|\tplayer->buffer[MAX_LOCKSTEP_EVENTS - 1].next = NULL;\n\tplayer->queue = NULL;|' mgba/src/gba/sio/lockstep.c
            # El mutex del coordinador de mGBA es un void* vacío con DISABLE_THREADING: con un hilo por consola hace falta uno real (cirilo_mx_* está en tools/cirilo_link.c)
            sed -i 's/\bMutexInit(/cirilo_mx_init(/g; s/\bMutexDeinit(/cirilo_mx_deinit(/g; s/\bMutexLock(/cirilo_mx_lock(/g; s/\bMutexUnlock(/cirilo_mx_unlock(/g' mgba/src/gba/sio/lockstep.c
            sed -i '0,/^#include <mgba\/internal\/gba\/sio\/lockstep.h>/s//&\nint cirilo_mx_init(Mutex*);\nint cirilo_mx_deinit(Mutex*);\nint cirilo_mx_lock(Mutex*);\nint cirilo_mx_unlock(Mutex*);/' mgba/src/gba/sio/lockstep.c
            sed -i 's/^void retro_run(void) {/void cirilo_runframe(struct mCore*);\nvoid* cirilo_vbuf(void*);\nvoid retro_run(void) {/; s/^\tcore->runFrame(core);/\tcirilo_runframe(core);/; s/videoCallback(outputBuffer, width/videoCallback(cirilo_vbuf(outputBuffer), width/' mgba/src/platform/libretro/libretro.c
            cat tools/cirilo_link.c >> mgba/src/platform/libretro/libretro.c
            if grep -q 'src/gba/sio/lockstep.c' mgba/CMakeLists.txt && grep -q 'src/gb/sio/lockstep.c' mgba/CMakeLists.txt && grep -q 'MAX_LOCKSTEP_EVENTS - 1\].next = NULL' mgba/src/gba/sio/lockstep.c && grep -c 'cirilo_mx_' mgba/src/gba/sio/lockstep.c | grep -qv '^[01]$' && ! grep -q 'MutexLock(' mgba/src/gba/sio/lockstep.c && grep -q 'cirilo_runframe(core);' mgba/src/platform/libretro/libretro.c && grep -q 'cirilo_vbuf(outputBuffer)' mgba/src/platform/libretro/libretro.c && grep -q cirilo_link_attach mgba/src/platform/libretro/libretro.c; then echo "ok: cable de Link local incluido"
            else echo "::warning::No se pudo parchear mGBA para el cable de Link local: se sigue sin cable"; git -C mgba checkout -- .; fi
          else echo "::warning::Sin cable de Link local (falta tools/cirilo_link.c o este mGBA no trae el lockstep esperado)"; fi
      - name: Trucos y ajustes del núcleo
        run: |
          cat cirilo/tools/cirilo_cheats.c >> cirilo/mgba/src/platform/libretro/libretro.c
          grep -q cirilo_cheat_apply cirilo/mgba/src/platform/libretro/libretro.c
          sed -i 's/PROPERTIES PREFIX "" COMPILE_DEFINITIONS/PROPERTIES COMPILE_DEFINITIONS/' cirilo/mgba/CMakeLists.txt
          ! grep -q 'PROPERTIES PREFIX "" COMPILE_DEFINITIONS' cirilo/mgba/CMakeLists.txt
      - name: Medidor de CPU (reparto del tiempo) en el núcleo
        run: |
          cd cirilo
          # Instrumenta ARMRunLoop, el dibujo de línea y el audio de mGBA y añade cirilo_prof_take (tools/cirilo_prof.c). Todo o nada: si este mGBA no encaja, se sigue sin medidor.
          if [ -f tools/cirilo_prof.c ] && [ -f tools/cirilo_prof_patch.py ] && python3 tools/cirilo_prof_patch.py mgba; then
            cat tools/cirilo_prof.c >> mgba/src/platform/libretro/libretro.c
            grep -q cirilo_prof_take mgba/src/platform/libretro/libretro.c
          else echo "::warning::Sin medidor de CPU: el panel no mostrará el reparto del tiempo"; fi
      - name: Camino rápido de memoria y ajuste de CPU (arm64) en el núcleo
        run: |
          cd cirilo
          # Resuelve en línea las cargas/guardados a IWRAM, EWRAM y ROM del intérprete (tools/cirilo_fast.h; mismos ciclos que mGBA, probado contra las funciones originales) y afina -mtune para arm64. Va ANTES de copiar mgba a mgba2, para que los dos núcleos lo lleven.
          # TUNE solo cambia el orden de las instrucciones, no el juego de instrucciones: vale en cualquier móvil. Poner el núcleo grande de tu CPU (cortex-a76, cortex-a77, cortex-a78, cortex-x1…) o dejarlo vacío para no usarlo.
          TUNE=cortex-a76
          if [ -f tools/cirilo_fast_patch.py ] && [ -f tools/cirilo_fast.h ] && python3 tools/cirilo_fast_patch.py mgba "$TUNE"; then echo "ok: camino rápido de memoria"
          else echo "::warning::Sin camino rápido de memoria: el núcleo sigue como mGBA original"; fi
      - name: JIT experimental de la CPU de GBA (Fase 1, opcional)
        run: |
          cd cirilo
          # tools/cirilo_jit_patch.py (todo o nada) añade la caché de bloques y la vigilancia de código automodificable. Va DESPUÉS del camino rápido (que le añade los avisos a cirilo_fast.h) y ANTES de copiar mgba a mgba2.
          # Se activa desde la app: Opciones → Avanzado → «Usar JIT experimental». Si el parche no encaja con este mGBA, el núcleo queda sin JIT y la app lo ignora.
          if [ -f tools/cirilo_jit_patch.py ] && [ -f tools/cirilo_jit.h ] && [ -f tools/cirilo_jit_arm.inc ] && python3 tools/cirilo_jit_patch.py mgba; then echo "ok: JIT"
          else echo "::warning::Sin JIT: el núcleo usa solo el intérprete"; fi
      - name: Perfil PGO - generar (solo si marcas «perfil»)
        if: ${{ inputs.perfil }}
        run: |
          cd cirilo
          # Build instrumentada: cuenta qué partes del núcleo se usan al jugar (no cambia lo que hace, solo lo ralentiza). Al cerrar el juego se vuelca a disco y se exporta desde Ajustes → Misceláneo.
          # NDK fijo = el que Gradle usa por defecto en este proyecto (sale en el log: «NDK (Side by side) 26.1.10909125»). Si cambias de versión de AGP y cambia, ponlo aquí y en el paso «usar».
          NDKV=26.1.10909125
          cat tools/cirilo_pgo.c >> mgba/src/platform/libretro/libretro.c
          grep -q cirilo_pgo_dump mgba/src/platform/libretro/libretro.c
          # el mismo NDK en la build de perfil y en la que lo usa: así llvm-profdata y el compilador son de la misma versión
          for m in core core2; do
            sed -i "s|-flto=thin -fwrapv|-flto=thin -fwrapv -fprofile-instr-generate|g; s|compileSdk=34|compileSdk=34;ndkVersion=\"$NDKV\"|" $m/build.gradle.kts
            grep -q 'fprofile-instr-generate' $m/build.gradle.kts && grep -q ndkVersion $m/build.gradle.kts
          done
          echo "ok: build de perfil (núcleos instrumentados)"
      - name: Perfil PGO - usar (si hay cirilo-pgo*.zip en el repositorio)
        if: ${{ !inputs.perfil }}
        run: |
          # Todo o nada: si falta el zip, o algo no encaja, la compilación sigue normal (sin PGO). Al segundo núcleo (Link local, carpeta mgba2) se le da el mismo perfil con las rutas de mgba/ cambiadas a mgba2/ (LLVM nombra las funciones static «ruta/archivo.c:función»).
          # Se usan TODOS los cirilo-pgo*.zip de la raíz del repositorio (uno acumulado, o varios de distintos juegos) y se mezclan solos.
          shopt -s nullglob; Z=(cirilo-pgo*.zip)
          [ ${#Z[@]} -gt 0 ] || { echo "Sin cirilo-pgo*.zip: compilación normal"; exit 0; }
          NDKV=26.1.10909125   # el mismo que en el paso «generar»
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          PD="$SDK/ndk/$NDKV/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-profdata"
          if [ ! -x "$PD" ]; then yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDKV" >/dev/null 2>&1 || true; fi
          if [ ! -x "$PD" ]; then echo "::warning::No encuentro llvm-profdata del NDK $NDKV: compilación sin PGO"; exit 0; fi
          rm -rf pgo && mkdir pgo; n=0
          for z in "${Z[@]}"; do n=$((n+1)); mkdir "pgo/$n"; unzip -q -o "$z" -d "pgo/$n" || true; done
          if ls pgo/*/*.profraw >/dev/null 2>&1 && "$PD" merge -o "$PWD/cirilo/cirilo.profdata" pgo/*/*.profraw; then
            echo "perfiles mezclados: ${#Z[@]} zip(s), $(ls pgo/*/*.profraw | wc -l) .profraw"
            sed -i "s|-flto=thin -fwrapv|-flto=thin -fwrapv -fprofile-use=$PWD/cirilo/cirilo.profdata -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date -Wno-profile-instr-missing|g; s|compileSdk=34|compileSdk=34;ndkVersion=\"$NDKV\"|" cirilo/core/build.gradle.kts
            grep -q 'fprofile-use' cirilo/core/build.gradle.kts && echo "ok: núcleo compilado con PGO" || echo "::warning::No se pudo activar PGO"
            # Segundo núcleo (Link local): mismo perfil, pero con las funciones static renombradas a la ruta de mgba2/ (las no static ya coinciden por nombre).
            if [ -d cirilo/core2 ]; then
              "$PD" merge --text -o pgo/perfil.txt cirilo/cirilo.profdata
              echo "Ejemplo de nombres con ruta en el perfil (para comprobar el prefijo):"; grep -m4 -E '\.(c|h|cpp):' pgo/perfil.txt || true
              T0=$(grep -cE '(^|/)mgba/(src|include)/' pgo/perfil.txt || true)
              sed -E '/\.(c|h|cpp):/ s#(^|/)mgba/(src|include)/#\1mgba2/\2/#g' pgo/perfil.txt > pgo/perfil2.txt
              P2=""
              if [ "${T0:-0}" -gt 0 ]; then
                "$PD" merge -o "$PWD/cirilo/cirilo2.profdata" pgo/perfil2.txt && { P2=1; MSG="${T0} nombres con ruta renombrados"; }
              elif grep -qE '^[A-Za-z0-9_.+-]+\.(c|h|cpp):' pgo/perfil.txt; then
                # LLVM guarda las funciones static solo como «archivo.c:función» (sin carpeta): los nombres de mgba/ y mgba2/ ya coinciden, vale el mismo perfil
                cp cirilo/cirilo.profdata cirilo/cirilo2.profdata && { P2=1; MSG="los nombres no llevan ruta: mismo perfil que el primer núcleo"; }
              fi
              if [ -n "$P2" ]; then
                sed -i "s|-flto=thin -fwrapv|-flto=thin -fwrapv -fprofile-use=$PWD/cirilo/cirilo2.profdata -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date -Wno-profile-instr-missing|g; s|compileSdk=34|compileSdk=34;ndkVersion=\"$NDKV\"|" cirilo/core2/build.gradle.kts
                grep -q 'fprofile-use' cirilo/core2/build.gradle.kts && echo "ok: segundo núcleo compilado con PGO ($MSG)" || echo "::warning::No se pudo activar PGO en el segundo núcleo"
              else echo "::warning::Segundo núcleo sin PGO: no reconozco los nombres del perfil (mira el ejemplo de arriba y dime cómo son)"; fi
            fi
          else echo "::warning::No se pudo mezclar el perfil (¿zip vacío o de otra versión?): compilación sin PGO"; fi
      - name: Ajustes avanzados (tipo de guardado y mosaico) en el núcleo
        run: |
          cd cirilo
          # Añade tools/cirilo_adv.c y parchea mGBA para poder forzar el tipo de guardado GBA y apagar el mosaico. Cada parche es opcional: si este mGBA no encaja, esa opción queda sin efecto (la app y el resto siguen igual).
          [ -f tools/cirilo_adv.c ] || { echo "::warning::Falta tools/cirilo_adv.c: sin ajustes avanzados en el núcleo"; exit 0; }
          FLAG=""
          # Los archivos se buscan por contenido (cambian de sitio entre versiones de mGBA); el enum SavedataType puede estar en interface.h o en savedata.h
          O=$(grep -rl 'GBAOverrideApply(struct GBA\*' mgba/src/gba --include=*.c | head -1)
          SAVELINE='GBASavedataForceType(&gba->memory.savedata, override->savetype);'
          if [ -n "$O" ] && [ "$(grep -c 'if (override->savetype != GBA_SAVEDATA_AUTODETECT) {' "$O")" = 1 ] && grep -q -F "$SAVELINE" "$O" \
             && ( for e in GBA_SAVEDATA_EEPROM GBA_SAVEDATA_SRAM GBA_SAVEDATA_FLASH512 GBA_SAVEDATA_FLASH1M GBA_SAVEDATA_FORCE_NONE GBA_SAVEDATA_AUTODETECT; do grep -rqw "$e" mgba/include || exit 1; done ); then
            sed -i 's|if (override->savetype != GBA_SAVEDATA_AUTODETECT) {|if (cirilo_savetype != -2) {\n\t\tGBASavedataForceType(\&gba->memory.savedata, (enum GBASavedataType) cirilo_savetype);\n\t} else if (override->savetype != GBA_SAVEDATA_AUTODETECT) {|' "$O"
            sed -i '0,/^#include/s//extern int cirilo_savetype;\n#include/' "$O"
            FLAG="#define CIRILO_HAVE_SAVEFORCE 1"; echo "ok: tipo de guardado forzable ($O)"
          else
            echo "::warning::No se pudo preparar «Tipo de guardado del cartucho»: la opción no tendrá efecto"
            echo "--- diagnóstico: archivo=$O"; [ -n "$O" ] && grep -n 'savetype\|GBASavedataForce' "$O" | head -20
            echo "--- enums:"; grep -rn 'GBA_SAVEDATA_' mgba/include | head -12
          fi
          if [ -f mgba/src/gb/mbc.c ] && [ "$(grep -c 'GBResizeSram(gb, sramSize);' mgba/src/gb/mbc.c)" = 1 ] && grep -q 'const struct GBCartridge\* cart = ' mgba/src/gb/mbc.c; then
            sed -i 's|GBResizeSram(gb, sramSize);|sramSize = cirilo_gb_sram(sramSize, (cart->cgb \& 0x80) != 0, gb->memory.mbcType);\n\tGBResizeSram(gb, sramSize);|' mgba/src/gb/mbc.c
            sed -i '0,/^#include/s//unsigned long cirilo_gb_sram(unsigned long, int, int);\n#include/' mgba/src/gb/mbc.c
            echo "ok: tamaño de guardado GB/GBC forzable"
          else echo "::warning::No se pudo preparar el tamaño de guardado de GB/GBC: esas opciones no tendrán efecto"; fi
          n=0
          for f in mgba/src/gba/renderers/*.c; do
            if grep -Eq 'GBARegisterBGCNTIsMosaic\([^()]*\)|GBAObjAttributesAIsMosaic\([^()]*\)' "$f"; then
              sed -i -E 's/(GBARegisterBGCNTIsMosaic|GBAObjAttributesAIsMosaic)\(([^()]*)\)/(cirilo_mosaic \&\& \1(\2))/g' "$f"
              sed -i '0,/^#include/s//extern int cirilo_mosaic;\n#include/' "$f"; n=$((n+1))
            fi
          done
          if [ "$n" -gt 0 ]; then echo "ok: mosaico desactivable ($n archivos)"; else echo "::warning::No se encontró el mosaico en los renderizadores: la opción no tendrá efecto"; fi
          { echo "$FLAG"; cat tools/cirilo_adv.c; } >> mgba/src/platform/libretro/libretro.c
          grep -q cirilo_adv_set mgba/src/platform/libretro/libretro.c
      - name: Segundo núcleo para Link local (copia de mgba con otro nombre de biblioteca)
        run: |
          cd cirilo
          # cada .so tiene sus propias variables globales: dos copias = dos consolas independientes en el mismo proceso
          rm -rf mgba2; cp -r mgba mgba2
          # renombra el objetivo libretro (mgba_libretro -> mgba2_libretro) en todos los CMakeLists, sea cual sea la versión de mGBA
          find mgba2 \( -name CMakeLists.txt -o -name '*.cmake' \) -exec sed -i 's/_libretro/2_libretro/g' {} +
          if grep -rq '}2_libretro\|mgba2_libretro' mgba2 --include=CMakeLists.txt --include='*.cmake'; then echo "ok: mgba2 -> libmgba2_libretro.so"
          else echo "::warning::No se pudo preparar el segundo núcleo: Link local no estará disponible"; rm -rf mgba2; fi
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.7"}
      - name: Clave de firma
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Falta el secreto KEYSTORE_B64"; exit 1; fi
          echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/cirilo.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/cirilo.jks" >> "$GITHUB_ENV"
          echo "SHA-1 de la clave de firma:"
          keytool -list -v -keystore "$RUNNER_TEMP/cirilo.jks" -alias "$KA" -storepass "$KP" | grep "SHA1"
      - run: gradle assembleDebug --no-daemon
        working-directory: cirilo
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Comprobar que los núcleos llevan lo esperado
        working-directory: cirilo
        run: |
          mkdir chk && unzip -q -o app/build/outputs/apk/debug/*.apk 'lib/*/*.so' -d chk
          for f in chk/lib/*/libmgba_libretro.so; do grep -q cirilo_cheat_apply "$f" && echo "ok trucos: $f" || { echo "::error::$f no exporta cirilo_cheat_apply"; exit 1; }; done
          if [ -d mgba2 ]; then for f in chk/lib/*/libmgba2_libretro.so; do [ -f "$f" ] && echo "ok segundo núcleo: $f" || { echo "::error::falta libmgba2_libretro.so en el APK"; exit 1; }; done; else echo "::warning::APK SIN segundo núcleo"; fi
          grep -q cirilo_link_attach mgba/src/platform/libretro/libretro.c && { for f in chk/lib/*/libmgba_libretro.so; do grep -q cirilo_link_attach "$f" && echo "ok cable: $f" || { echo "::error::$f no exporta cirilo_link_attach"; exit 1; }; done; } || echo "::warning::APK SIN cable de Link local"
          [ -f mgba/include/mgba/internal/gba/cirilo_fast.h ] && echo "ok camino rápido de memoria" || echo "::warning::APK SIN camino rápido de memoria"
          grep -q cirilo_prof_take mgba/src/platform/libretro/libretro.c && { for f in chk/lib/*/libmgba_libretro.so; do grep -q cirilo_prof_take "$f" && echo "ok medidor: $f" || { echo "::error::$f no exporta cirilo_prof_take"; exit 1; }; done; } || echo "::warning::APK SIN medidor de CPU"
      - name: Comprobar build de perfil
        if: ${{ inputs.perfil }}
        working-directory: cirilo
        run: |
          for f in chk/lib/*/libmgba_libretro.so; do grep -q cirilo_pgo_dump "$f" && echo "ok perfil: $f" || { echo "::error::$f no exporta cirilo_pgo_dump"; exit 1; }; done
      - uses: actions/upload-artifact@v4
        with: {name: "${{ inputs.perfil && 'cirilo-perfil' || 'cirilo-debug' }}", path: cirilo/app/build/outputs/apk/debug/*.apk}
